interface:
  display_name: "Codex Director"
  short_description: "Coordinate project work across Codex worker threads with quiet, signal-first monitoring"
  default_prompt: "Use $codex-director to coordinate this project task with appropriate worker threads, explicit $director-* workflow skills, dynamic workflows, goals, reviews, helper/subagent lanes for non-trivial workers, and evidence gates. Always record each worker or packet's selected workflow/playbook and top-level control loop before dispatch and in ledger/status entries. Keep the parent Director title stable as <Project Display Name> Director and restore it if task auto-title drift occurs. Accept Director-created workers only after child-thread readback and evidence reconciliation; direct leaf is worker-internal only for tiny/mechanical/low-risk work. A coordinator final checkpoint is not final task completion until the Director dispatches the next worker, records its monitor, or records a dispatch blocker/approval wait. Pending worktree ids count as active handles and must stay monitored."

policy:
  allow_implicit_invocation: false
