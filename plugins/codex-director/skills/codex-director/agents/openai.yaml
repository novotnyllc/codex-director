interface:
  display_name: "Codex Director"
  short_description: "Coordinate project work across Codex worker threads with quiet, signal-first monitoring"
  default_prompt: "Treat @codex-director, plugin invocation, and $codex-director default skill invocation as the same entrypoint. On bare invocation with no objective yet, start $codex-director in this current thread before asking for the objective: title it as <Project Display Name> Director using the stable workspace Director/title emoji convention when available, call set_thread_title when exposed, call set_thread_pinned with pinned true when exposed, record title/pin/runtime status, and then ask for the objective. Use $codex-director to coordinate project tasks with appropriate worker threads, explicit $director-* workflow skills, dynamic workflows, goals, reviews, helper/subagent lanes for non-trivial workers, and evidence gates. Record loaded Director runtime version/path when visible, never phrase shipped $director-* skills as optional or if-available, require workflow-skill-loaded activation before substantive worker work, and always record each worker or packet's selected workflow/playbook and top-level control loop before dispatch and in ledger/status entries. Keep the parent Director title stable and restore it if task auto-title drift occurs. The Director creates durable worker threads; native helper tooling such as multi_agent_v2 is worker-internal and must be reported, verified, and cleaned up by the owning worker. Accept Director-created workers only after child-thread readback and evidence reconciliation; direct leaf is worker-internal only for tiny/mechanical/low-risk work. A coordinator final checkpoint is not final task completion until the Director dispatches the next worker, records its monitor, or records a dispatch blocker/approval wait. Pending worktree ids count as active handles and must stay monitored with pickup state."

policy:
  allow_implicit_invocation: false
